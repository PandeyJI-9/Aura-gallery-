          // ==================== MEDIA PAGER SCREEN ====================
          
          @Composable
          fun MediaPagerScreen(
              mediaList: List<Media>,
              initialIndex: Int,
              onBack: () -> Unit,
              onFavoriteToggle: (Int, Boolean) -> Unit,
              onDelete: (Int) -> Unit = {},
              onSetWallpaper: (String) -> Unit = {}
          ) {
              val pagerState = rememberPagerState(initialPage = initialIndex) { mediaList.size }
              var currentZoom by remember { mutableFloatStateOf(1f) }
          
              HorizontalPager(
                  state = pagerState,
                  modifier = Modifier.fillMaxSize(),
                  userScrollEnabled = currentZoom <= 1.05f,
                  key = { mediaList[it].uri }
              ) { page ->
                  MediaViewer(
                      media = mediaList[page],
                      onBack = onBack,
                      isFavorite = mediaList[page].isFavorite,
                      onFavoriteToggle = { onFavoriteToggle(page, it) },
                      onDelete = { onDelete(page) },
                      onSetWallpaper = { onSetWallpaper(mediaList[page].uri) },
                      onZoomChanged = { zoom ->
                          if (pagerState.currentPage == page) currentZoom = zoom
                      }
                  )
              }
          
              // Animated page indicator
              Box(
                  modifier = Modifier.fillMaxSize().padding(top = 48.dp),
                  contentAlignment = Alignment.TopCenter
              ) {
                  AnimatedVisibility(
                      visible = mediaList.size > 1 && currentZoom <= 1.05f,
                      enter = fadeIn(tween(400)),
                      exit = fadeOut(tween(300))
                  ) {
                      Text(
                          text = "${pagerState.currentPage + 1} / ${mediaList.size}",
                          color = Color.White.copy(alpha = 0.6f),
                          fontSize = 12.sp,
                          modifier = Modifier
                              .background(Color.Black.copy(alpha = 0.4f), RoundedCornerShape(12.dp))
                              .padding(horizontal = 12.dp, vertical = 4.dp)
                      )
                  }
              }
          }
          
          // ==================== MEDIA VIEWER ====================
          
          @Composable
          fun MediaViewer(
              media: Media,
              onBack: () -> Unit,
              isFavorite: Boolean = false,
              onFavoriteToggle: (Boolean) -> Unit = {},
              onDelete: () -> Unit = {},
              onSetWallpaper: () -> Unit = {},
              onZoomChanged: (Float) -> Unit = {}
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val scale = remember { Animatable(1f) }
              val dismissDragY = remember { Animatable(0f) }
              val dismissScale = remember { Animatable(1f) }
              val backgroundAlpha = remember { Animatable(1f) }
              var offset by remember { mutableStateOf(Offset.Zero) }
              var showOverlay by remember { mutableStateOf(true) }
              var isFavoritedLocal by remember { mutableStateOf(isFavorite) }
              var showInfoSheet by remember { mutableStateOf(false) }
              var showDeleteConfirm by remember { mutableStateOf(false) }
          
              // Delete confirmation in viewer
              if (showDeleteConfirm) {
                  AlertDialog(
                      onDismissRequest = { showDeleteConfirm = false },
                      title = { Text("Delete this ${if (media.isVideo) "video" else "photo"}?", color = Color.White) },
                      text = { Text("This action cannot be undone.", color = Color.White.copy(alpha = 0.7f)) },
                      confirmButton = {
                          Button(
                              onClick = { showDeleteConfirm = false; onDelete() },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFF4444))
                          ) { Text("Delete", color = Color.White) }
                      },
                      dismissButton = {
                          TextButton(onClick = { showDeleteConfirm = false }) {
                              Text("Cancel", color = Color(0xFFFFD700))
                          }
                      },
                      containerColor = Color(0xFF1A1A1A)
                  )
              }
          
              if (media.isVideo) {
                  val exoPlayer = remember(media.uri) {
                      ExoPlayer.Builder(context).build().apply {
                          setMediaItem(MediaItem.fromUri(media.uri))
                          prepare()
                          playWhenReady = true
                      }
                  }
          
                  val lifecycleOwner = androidx.compose.ui.platform.LocalLifecycleOwner.current
                  DisposableEffect(lifecycleOwner, exoPlayer) {
                      val observer = LifecycleEventObserver { _, event ->
                          if (event == Lifecycle.Event.ON_RESUME) exoPlayer.play()
                          else if (event == Lifecycle.Event.ON_PAUSE) exoPlayer.pause()
                      }
                      lifecycleOwner.lifecycle.addObserver(observer)
                      onDispose {
                          lifecycleOwner.lifecycle.removeObserver(observer)
                          exoPlayer.release()
                      }
                  }
          
                  Box(
                      modifier = Modifier.fillMaxSize().background(Color.Black),
                      contentAlignment = Alignment.Center
                  ) {
                      AndroidView(
                          factory = { ctx ->
                              PlayerView(ctx).apply {
                                  player = exoPlayer
                                  useController = true
                                  resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                                  layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                              }
                          },
                          modifier = Modifier.fillMaxSize()
                      )
          
                      IconButton(
                          onClick = onBack,
                          modifier = Modifier.align(Alignment.TopStart).padding(top = 40.dp, start = 16.dp)
                              .background(Color.Black.copy(alpha = 0.5f), RoundedCornerShape(12.dp))
                      ) {
                          Icon(Icons.Default.ArrowBack, contentDescription = "Back", tint = Color.White)
                      }
          
                      MediaViewerOverlay(
                          media = media,
                          onClose = onBack,
                          onFavorite = { isFavoritedLocal = it; onFavoriteToggle(it) },
                          onInfoClick = { showInfoSheet = true },
                          onDelete = { showDeleteConfirm = true },
                          onSetWallpaper = onSetWallpaper,
                          isFavorite = isFavoritedLocal,
                          modifier = Modifier.align(Alignment.BottomCenter)
                      )
                  }
              } else {
                  BoxWithConstraints(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black.copy(alpha = backgroundAlpha.value.coerceIn(0f, 1f))),
                      contentAlignment = Alignment.Center
                  ) {
                      val screenWidth = constraints.maxWidth.toFloat()
                      val screenHeight = constraints.maxHeight.toFloat()
                      val isZoomed = scale.value > 1.05f
          
                      val imageGestureModifier = Modifier
                          .fillMaxSize()
                          .graphicsLayer(
                              scaleX = scale.value * dismissScale.value,
                              scaleY = scale.value * dismissScale.value,
                              translationX = offset.x,
                              translationY = offset.y + dismissDragY.value
                          )
                          .pointerInput(isZoomed) {
                              if (isZoomed) {
                                  detectTransformGestures { _, pan, zoom, _ ->
                                      scope.launch {
                                          val nextScale = (scale.value * zoom).coerceIn(1f, 5f)
                                          scale.snapTo(nextScale)
                                          onZoomChanged(nextScale)
                                          if (nextScale > 1.05f) {
                                              val maxX = (screenWidth * (nextScale - 1f) / 2f).coerceAtLeast(0f)
                                              val maxY = (screenHeight * (nextScale - 1f) / 2f).coerceAtLeast(0f)
                                              val newX = (offset.x + pan.x).coerceIn(-maxX, maxX)
                                              val newY = (offset.y + pan.y).coerceIn(-maxY, maxY)
                                              offset = Offset(newX, newY)
                                          } else {
                                              offset = Offset.Zero
                                          }
                                      }
                                  }
                              } else {
                                  detectVerticalDragGestures(
                                      onDragEnd = {
                                          scope.launch {
                                              if (dismissDragY.value > 160f) {
                                                  launch { dismissDragY.animateTo(screenHeight, tween(180)) }
                                                  launch { backgroundAlpha.animateTo(0f, tween(180)) }
                                                  onBack()
                                              } else {
                                                  launch { dismissDragY.animateTo(0f, spring(dampingRatio = 0.8f)) }
                                                  launch { dismissScale.animateTo(1f, spring(dampingRatio = 0.8f)) }
                                                  launch { backgroundAlpha.animateTo(1f, spring(dampingRatio = 0.8f)) }
                                              }
                                          }
                                      },
                                      onVerticalDrag = { change, dragAmount ->
                                          if (dragAmount > 0 || dismissDragY.value > 0f) {
                                              change.consume()
                                              scope.launch {
                                                  val newY = (dismissDragY.value + dragAmount).coerceAtLeast(0f)
                                                  dismissDragY.snapTo(newY)
                                                  val progress = (newY / screenHeight).coerceIn(0f, 1f)
                                                  dismissScale.snapTo(1f - (progress * 0.35f))
                                                  backgroundAlpha.snapTo(1f - (progress * 0.8f))
                                              }
                                          } else if (dragAmount < -35f && dismissDragY.value == 0f) {
                                              change.consume()
                                              showInfoSheet = true
                                          }
                                      }
                                  )
                              }
                          }
                          .pointerInput(Unit) {
                              detectTapGestures(
                                  onDoubleTap = { tapOffset ->
                                      scope.launch {
                                          if (scale.value > 1.05f) {
                                              scale.animateTo(1f, spring(dampingRatio = 0.8f))
                                              offset = Offset.Zero
                                              onZoomChanged(1f)
                                          } else {
                                              scale.animateTo(2.8f, spring(dampingRatio = 0.8f))
                                              val targetX = (screenWidth / 2f - tapOffset.x) * 1.8f
                                              val targetY = (screenHeight / 2f - tapOffset.y) * 1.8f
                                              val maxX = (screenWidth * 1.8f) / 2f
                                              val maxY = (screenHeight * 1.8f) / 2f
                                              offset = Offset(targetX.coerceIn(-maxX, maxX), targetY.coerceIn(-maxY, maxY))
                                              onZoomChanged(2.8f)
                                          }
                                      }
                                  },
                                  onTap = { showOverlay = !showOverlay }
                              )
                          }
          
                      AsyncImage(
                          model = ImageRequest.Builder(context).data(media.uri).crossfade(true).build(),
                          contentDescription = null,
                          contentScale = ContentScale.Fit,
                          modifier = imageGestureModifier
                      )
          
                      // Overlay with animated visibility
                      AnimatedVisibility(
                          visible = showOverlay && scale.value <= 1.05f && dismissDragY.value < 50f,
                          enter = fadeIn(tween(200)) + slideInVertically(tween(250)) { it / 2 },
                          exit = fadeOut(tween(150)) + slideOutVertically(tween(200)) { it / 2 },
                          modifier = Modifier.align(Alignment.BottomCenter)
                      ) {
                          MediaViewerOverlay(
                              media = media,
                              onClose = onBack,
                              onFavorite = { isFavoritedLocal = it; onFavoriteToggle(it) },
                              onInfoClick = { showInfoSheet = true },
                              onDelete = { showDeleteConfirm = true },
                              onSetWallpaper = onSetWallpaper,
                              isFavorite = isFavoritedLocal,
                              modifier = Modifier
                          )
                      }
          
                      // Back button with animated visibility
                      AnimatedVisibility(
                          visible = showOverlay && scale.value <= 1.05f && dismissDragY.value < 50f,
                          enter = fadeIn(tween(200)) + slideInVertically(tween(250)) { -it },
                          exit = fadeOut(tween(200)) + slideOutVertically(tween(250)) { -it },
                          modifier = Modifier.align(Alignment.TopStart)
                      ) {
                          IconButton(
                              onClick = onBack,
                              modifier = Modifier
                                  .padding(top = 40.dp, start = 16.dp)
                                  .background(Color.Black.copy(alpha = 0.5f), RoundedCornerShape(12.dp))
                          ) {
                              Icon(Icons.Default.ArrowBack, contentDescription = "Back", tint = Color.White)
                          }
                      }
                  }
              }
          
              if (showInfoSheet) {
                  MediaInfoBottomSheet(media = media, onDismiss = { showInfoSheet = false })
              }
          }
          
          // ==================== MEDIA VIEWER OVERLAY ====================
          
          @Composable
          fun MediaViewerOverlay(
              media: Media,
              onClose: () -> Unit,
              onFavorite: (Boolean) -> Unit,
              onInfoClick: () -> Unit,
              onDelete: () -> Unit = {},
              onSetWallpaper: () -> Unit = {},
              isFavorite: Boolean,
              modifier: Modifier = Modifier
          ) {
              val haptic = LocalHapticFeedback.current
              val context = LocalContext.current
              val hazeState = remember { HazeState() }
              Box(
                  modifier = modifier
                      .fillMaxWidth()
                      .height(82.dp)
                      .padding(12.dp)
                      .hazeChild(
                          state = hazeState,
                          shape = RoundedCornerShape(20.dp),
                          style = HazeStyle(tint = Color.White.copy(alpha = 0.15f), blurRadius = 30.dp, noiseFactor = 0.05f)
                      )
              ) {
                  Row(
                      modifier = Modifier.fillMaxSize().padding(horizontal = 8.dp),
                      horizontalArrangement = Arrangement.SpaceEvenly,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      // Favorite
                      OverlayButton(
