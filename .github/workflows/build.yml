              if (!hasPerm) {
                  AlertDialog(
                      onDismissRequest = { },
                      title = { Text("Permission Required", color = Color.White) },
                      text = { Text("Aura Gallery needs access to your photos and videos to display your media.", color = Color.White) },
                      confirmButton = {
                          Button(
