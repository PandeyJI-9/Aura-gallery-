name: Build Aura Gallery APK 👑🔥

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project
        run: |
          rm -rf app/src/main/java/*
          mkdir -p app/src/main/java/com/pandeyji/aura/gallery
          mkdir -p app/src/main/res/values

          # Gradle Properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          EOF

          # Settings Gradle
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Aura Gallery"
          include(":app")
          EOF

          # Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          # App build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.pandeyji.aura.gallery"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.pandeyji.aura.gallery"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 3
                  versionName = "4.3.0"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("dev.chrisbanes.haze:haze:0.6.0")
              implementation("io.coil-kt:coil-compose:2.6.0")
              implementation("androidx.media3:media3-exoplayer:1.2.1")
              implementation("androidx.media3:media3-ui:1.2.1")
          }
          EOF


          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.SET_WALLPAPER" />
          
              <application
                  android:allowBackup="true"
                  android:label="Aura Gallery"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Aura Gallery</string>
          </resources>
          EOF

          # MediaModel.kt
          cat << 'EOF' > app/src/main/java/com/pandeyji/aura/gallery/MediaModel.kt
          package com.pandeyji.aura.gallery
          
          data class Media(
              val uri: String,
              val mediaId: Long = 0L,
              val isVideo: Boolean,
              val bucketName: String = "Camera",
              val bucketId: Long = 0L,
              val isFavorite: Boolean = false,
              val timestamp: Long = 0L,
              val displayName: String = "",
              val fileSize: Long = 0L,
              val width: Int = 0,
              val height: Int = 0,
              val mimeType: String = "",
              val duration: Long = 0L
          )
          
          data class Album(
              val bucketId: Long,
              val bucketName: String,
              val thumbnailUri: String,
              val count: Int,
              val lastModified: Long
          )
          
          enum class ViewMode {
              ALL_MEDIA,
              ALBUMS,
              ALBUM_DETAIL,
              FAVORITES
          }
          
          enum class SortMode(val label: String) {
              DATE_DESC("Newest First"),
              DATE_ASC("Oldest First"),
              NAME_ASC("Name A-Z"),
              NAME_DESC("Name Z-A"),
              SIZE_DESC("Largest First"),
              SIZE_ASC("Smallest First")
          }
          
          // Date group labels for timeline headers
          data class DateGroup(
              val label: String,
              val timestamp: Long
          )
          EOF

          # Components.kt
          cat << 'EOF' > app/src/main/java/com/pandeyji/aura/gallery/Components.kt
          @file:OptIn(
              androidx.compose.foundation.ExperimentalFoundationApi::class,
              androidx.compose.material3.ExperimentalMaterial3Api::class
          )
          
          package com.pandeyji.aura.gallery
          
          import android.content.Intent
          import android.net.Uri
          import android.view.ViewGroup
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.gestures.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.*
          import androidx.compose.foundation.pager.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.*
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.hapticfeedback.HapticFeedbackType
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.*
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.*
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView
          import coil.compose.AsyncImage
          import coil.request.ImageRequest
          import dev.chrisbanes.haze.*
          import kotlinx.coroutines.launch
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          
          // ==================== PANDEY JI GLOW ====================
          
          @Composable
          fun PandeyJiGlow() {
              val anim = rememberInfiniteTransition(label = "glow")
              val alpha by anim.animateFloat(
                  0.3f, 1f,
                  infiniteRepeatable(tween(1400), RepeatMode.Reverse),
                  label = "alpha"
              )
              Text(
                  "Developed By Pandey Ji 👑",
                  color = Color(0xFFFFD700).copy(alpha = alpha),
                  style = TextStyle(shadow = Shadow(Color(0xFFFFD700), blurRadius = 25f * alpha)),
                  fontSize = 18.sp,
                  fontWeight = FontWeight.ExtraBold
              )
          }
          
          // ==================== TOP BAR ====================
          
          @Composable
          fun TopBar(
              screen: String,
              hazeState: HazeState,
              blurVal: Float,
              isScrolling: Boolean,
              modifier: Modifier,
              onProfileClick: () -> Unit,
              onSearchChange: (String) -> Unit,
              mediaCount: Int = 0,
              onSortClick: () -> Unit = {}
          ) {
              val haptic = LocalHapticFeedback.current
              val offsetY by animateDpAsState(
                  targetValue = if (isScrolling) (-100).dp else 0.dp,
                  animationSpec = spring(dampingRatio = Spring.DampingRatioLowBouncy, stiffness = Spring.StiffnessLow),
                  label = "topBarSlide"
              )
              val topBarAlpha by animateFloatAsState(
                  targetValue = if (isScrolling) 0f else 1f,
                  animationSpec = tween(250),
                  label = "topBarAlpha"
              )
              var searchQuery by remember { mutableStateOf("") }
          
              Column(
                  modifier = modifier
                      .offset(y = offsetY)
                      .graphicsLayer(alpha = topBarAlpha)
              ) {
                  Box(
                      modifier = Modifier
                          .padding(top = 16.dp, start = 20.dp, end = 20.dp)
                          .fillMaxWidth()
                          .height(56.dp)
                          .shadow(12.dp, RoundedCornerShape(28.dp))
                          .hazeChild(
                              hazeState,
                              RoundedCornerShape(28.dp),
                              HazeStyle(
                                  tint = Color.White.copy(alpha = 0.12f),
                                  blurRadius = blurVal.dp,
                                  noiseFactor = 0.05f
                              )
                          )
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(horizontal = 16.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Icon(Icons.Default.Search, null, tint = Color.Gray, modifier = Modifier.size(20.dp))
                          TextField(
                              value = searchQuery,
                              onValueChange = {
                                  searchQuery = it
                                  onSearchChange(it)
                              },
                              placeholder = {
                                  Text(
                                      if (mediaCount > 0) "Search $mediaCount photos & videos..."
                                      else "Search photos, albums...",
                                      color = Color.Gray, fontSize = 14.sp
                                  )
                              },
                              modifier = Modifier
                                  .weight(1f)
                                  .padding(start = 8.dp),
                              colors = TextFieldDefaults.colors(
                                  unfocusedContainerColor = Color.Transparent,
                                  focusedContainerColor = Color.Transparent,
                                  unfocusedIndicatorColor = Color.Transparent,
                                  focusedIndicatorColor = Color.Transparent
                              ),
                              textStyle = TextStyle(color = Color.White, fontSize = 14.sp),
                              singleLine = true
                          )
                          if (searchQuery.isNotEmpty()) {
                              IconButton(onClick = { searchQuery = ""; onSearchChange("") }) {
                                  Icon(Icons.Default.Clear, null, tint = Color.Gray, modifier = Modifier.size(18.dp))
                              }
                          }
                          // Sort button
                          IconButton(onClick = {
                              haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                              onSortClick()
                          }) {
                              Icon(
                                  Icons.Default.List,
                                  contentDescription = "Sort",
                                  tint = Color.White.copy(alpha = 0.7f),
                                  modifier = Modifier.size(20.dp)
                              )
                          }
                          // Settings
                          IconButton(onClick = {
                              haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                              onProfileClick()
                          }) {
                              Icon(
                                  Icons.Default.Person, null,
                                  tint = if (screen == "SETTINGS") Color(0xFFFFD700) else Color.White.copy(alpha = 0.8f),
                                  modifier = Modifier.size(22.dp)
                              )
                          }
                      }
                  }
              }
          }
          
          // ==================== SELECTION BAR (Multi-Select Mode) ====================
          
          @Composable
          fun SelectionBar(
              selectedCount: Int,
              totalCount: Int,
              onSelectAll: () -> Unit,
              onDelete: () -> Unit,
              onShare: () -> Unit,
              onClose: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              val haptic = LocalHapticFeedback.current
              val enterAnim = remember { Animatable(0f) }
              LaunchedEffect(Unit) { enterAnim.animateTo(1f, spring(dampingRatio = 0.7f)) }
          
              Box(
                  modifier = modifier
                      .fillMaxWidth()
                      .graphicsLayer(scaleY = enterAnim.value, alpha = enterAnim.value)
                      .background(Color(0xFF1A1A1A))
                      .padding(top = 8.dp, bottom = 8.dp)
              ) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 16.dp, vertical = 8.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          IconButton(onClick = {
                              haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                              onClose()
                          }) {
                              Icon(Icons.Default.Close, contentDescription = "Cancel", tint = Color.White)
                          }
                          Text(
                              text = "$selectedCount selected",
                              color = Color(0xFFFFD700),
                              fontSize = 16.sp,
                              fontWeight = FontWeight.Bold,
                              modifier = Modifier.padding(start = 4.dp)
                          )
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                          // Select All / Deselect
                          IconButton(onClick = {
                              haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                              onSelectAll()
                          }) {
                              Icon(
                                  Icons.Default.CheckCircle,
                                  contentDescription = "Select All",
                                  tint = if (selectedCount == totalCount) Color(0xFFFFD700) else Color.White.copy(alpha = 0.4f)
                              )
                          }
                          // Share selected
                          IconButton(onClick = {
                              haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                              onShare()
                          }) {
                              Icon(Icons.Default.Share, contentDescription = "Share", tint = Color.White)
                          }
                          // Delete selected
                          IconButton(onClick = {
                              haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                              onDelete()
                          }) {
                              Icon(Icons.Default.Delete, contentDescription = "Delete", tint = Color(0xFFFF4444))
                          }
                      }
                  }
              }
          }
          
          // ==================== SORT BOTTOM SHEET ====================
          
          @Composable
          fun SortBottomSheet(
              currentSort: SortMode,
              onSortChange: (SortMode) -> Unit,
              onDismiss: () -> Unit
          ) {
              val sheetState = rememberModalBottomSheetState(skipPartiallyExpanded = true)
          
              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  sheetState = sheetState,
                  containerColor = Color(0xFF141414),
                  scrimColor = Color.Black.copy(alpha = 0.65f),
                  shape = RoundedCornerShape(topStart = 28.dp, topEnd = 28.dp)
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(24.dp)
                          .navigationBarsPadding()
                  ) {
                      Text("Sort By", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(16.dp))
                      HorizontalDivider(color = Color.White.copy(alpha = 0.1f))
                      Spacer(Modifier.height(8.dp))
          
                      SortMode.values().forEach { mode ->
                          val isSelected = currentSort == mode
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(12.dp))
                                  .clickable { onSortChange(mode) }
                                  .background(
                                      if (isSelected) Color(0xFFFFD700).copy(alpha = 0.15f) else Color.Transparent,
                                      RoundedCornerShape(12.dp)
                                  )
                                  .padding(horizontal = 16.dp, vertical = 14.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Icon(
                                      when (mode) {
                                          SortMode.DATE_DESC, SortMode.DATE_ASC -> Icons.Default.DateRange
                                          SortMode.NAME_ASC, SortMode.NAME_DESC -> Icons.Default.Edit
                                          SortMode.SIZE_DESC, SortMode.SIZE_ASC -> Icons.Default.Info
                                      },
                                      contentDescription = null,
                                      tint = if (isSelected) Color(0xFFFFD700) else Color.White.copy(alpha = 0.6f),
                                      modifier = Modifier.size(20.dp)
                                  )
                                  Spacer(Modifier.width(12.dp))
                                  Text(
                                      text = mode.label,
                                      color = if (isSelected) Color(0xFFFFD700) else Color.White,
                                      fontSize = 15.sp,
                                      fontWeight = if (isSelected) FontWeight.Bold else FontWeight.Normal
                                  )
                              }
                              if (isSelected) {
                                  Icon(Icons.Default.Check, null, tint = Color(0xFFFFD700), modifier = Modifier.size(20.dp))
                              }
                          }
                      }
                      Spacer(Modifier.height(16.dp))
                  }
              }
          }
          
          // ==================== ALBUM FILTER CHIPS ====================
          
          @Composable
          fun AlbumFilterChips(
              currentMode: ViewMode,
              onModeChange: (ViewMode) -> Unit,
              hazeState: HazeState,
              blurVal: Float,
              modifier: Modifier = Modifier
          ) {
              Row(
                  modifier = modifier
                      .fillMaxWidth()
                      .horizontalScroll(rememberScrollState())
                      .padding(horizontal = 16.dp, vertical = 6.dp),
                  horizontalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  listOf(
                      Pair(ViewMode.ALL_MEDIA, "All Media"),
                      Pair(ViewMode.ALBUMS, "Albums"),
                      Pair(ViewMode.FAVORITES, "Favorites")
                  ).forEach { (mode, label) ->
                      FilterChip(
                          selected = currentMode == mode,
                          onClick = { onModeChange(mode) },
                          label = { Text(label, fontSize = 12.sp) },
                          modifier = Modifier.hazeChild(
                              hazeState,
                              RoundedCornerShape(20.dp),
                              HazeStyle(
                                  tint = if (currentMode == mode) Color(0xFFFFD700).copy(alpha = 0.2f) else Color.White.copy(alpha = 0.08f),
                                  blurRadius = blurVal.dp,
                                  noiseFactor = 0.03f
                              )
                          ),
                          colors = FilterChipDefaults.filterChipColors(
                              selectedContainerColor = Color(0xFFFFD700).copy(alpha = 0.3f),
                              selectedLabelColor = Color(0xFFFFD700),
                              labelColor = Color.White.copy(alpha = 0.7f)
                          )
                      )
                  }
              }
          }
          
          // ==================== BOTTOM DOCK ====================
          
          @Composable
          fun BottomDock(
              screen: String,
              hazeState: HazeState,
              blurVal: Float,
              isScrolling: Boolean,
              modifier: Modifier,
              onScreenChange: (String) -> Unit
          ) {
              val haptic = LocalHapticFeedback.current
              val offsetY by animateDpAsState(
                  targetValue = if (isScrolling) 100.dp else 0.dp,
                  animationSpec = spring(dampingRatio = Spring.DampingRatioLowBouncy, stiffness = Spring.StiffnessLow),
                  label = "bottomDockSlide"
              )
              val dockAlpha by animateFloatAsState(
                  targetValue = if (isScrolling) 0f else 1f,
                  animationSpec = tween(250),
                  label = "dockAlpha"
              )
          
              Box(
                  modifier = modifier
                      .offset(y = offsetY)
                      .graphicsLayer(alpha = dockAlpha)
                      .padding(bottom = 20.dp, start = 24.dp, end = 24.dp)
                      .fillMaxWidth()
                      .height(68.dp)
                      .hazeChild(
                          state = hazeState,
                          shape = RoundedCornerShape(34.dp),
                          style = HazeStyle(
                              tint = Color.White.copy(alpha = 0.15f),
                              blurRadius = blurVal.dp,
                              noiseFactor = 0.05f
                          )
                      )
              ) {
                  Row(
                      modifier = Modifier.fillMaxSize(),
                      horizontalArrangement = Arrangement.SpaceEvenly,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      DockButton(Icons.Default.Home, "Photos", screen == "GALLERY") {
                          haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                          onScreenChange("GALLERY")
                      }
                      DockButton(Icons.Default.Search, "Explore", screen == "EXPLORE") {
                          haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                          onScreenChange("EXPLORE")
                      }
                      DockButton(Icons.Default.Edit, "Studio", screen == "STUDIO") {
                          haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                          onScreenChange("STUDIO")
                      }
                      DockButton(Icons.Default.Lock, "Vault", screen == "VAULT") {
                          haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                          onScreenChange("VAULT")
                      }
                  }
              }
          }
          
          @Composable
          fun DockButton(
              icon: androidx.compose.ui.graphics.vector.ImageVector,
              label: String,
              isActive: Boolean,
              onClick: () -> Unit
          ) {
              val haptic = LocalHapticFeedback.current
              val scale by animateFloatAsState(
                  targetValue = if (isActive) 1.15f else 1f,
                  animationSpec = spring(dampingRatio = Spring.DampingRatioMediumBouncy, stiffness = Spring.StiffnessMedium),
                  label = "scale"
              )
              val tint by animateColorAsState(
                  targetValue = if (isActive) Color(0xFFFFD700) else Color.White.copy(alpha = 0.65f),
                  animationSpec = tween(250),
                  label = "tint"
              )
              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center,
                  modifier = Modifier
                      .graphicsLayer(scaleX = scale, scaleY = scale)
                      .clip(RoundedCornerShape(16.dp))
                      .clickable(onClick = {
                          haptic.performHapticFeedback(HapticFeedbackType.TextHandleMove)
                          onClick()
                      })
                      .padding(horizontal = 10.dp, vertical = 6.dp)
              ) {
                  Icon(icon, contentDescription = label, tint = tint, modifier = Modifier.size(24.dp))
                  Spacer(Modifier.height(2.dp))
                  Text(
                      text = label,
                      color = tint,
                      fontSize = 10.sp,
                      fontWeight = if (isActive) FontWeight.Bold else FontWeight.Normal
                  )
              }
          }
          
          // ==================== SETTINGS HUB ====================
          
          @Composable
          fun SettingsHub(
              blurVal: Float,
              onBlurChange: (Float) -> Unit,
              gridColumns: Int,
              onGridColumnsChange: (Int) -> Unit,
              mediaCount: Int,
              albumCount: Int,
              totalSize: Long,
              hazeState: HazeState
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .haze(state = hazeState)
                      .padding(24.dp)
                      .padding(top = 90.dp, bottom = 90.dp)
                      .verticalScroll(rememberScrollState()),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Text("AURA SETTINGS", color = Color.White, fontSize = 24.sp, fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
          
                  Spacer(Modifier.height(20.dp))
          
                  // Storage Info Card
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF181818)),
                      shape = RoundedCornerShape(16.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("📊 Library Stats", color = Color(0xFFFFD700), fontSize = 14.sp, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(8.dp))
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                              StatItem("$mediaCount", "Photos & Videos")
                              StatItem("$albumCount", "Albums")
                              StatItem(formatFileSize(totalSize), "Total Size")
                          }
                      }
                  }
          
                  Spacer(Modifier.height(20.dp))
          
                  // Blur Control
                  Text("Liquid Glass Blur: ${blurVal.toInt()} dp", color = Color.Gray)
                  Slider(
                      value = blurVal,
                      onValueChange = onBlurChange,
                      valueRange = 10f..80f,
                      colors = SliderDefaults.colors(
                          thumbColor = Color(0xFFFFD700),
                          activeTrackColor = Color(0xFFFFD700)
                      ),
                      modifier = Modifier.padding(horizontal = 16.dp)
                  )
          
                  Spacer(Modifier.height(16.dp))
          
                  // Grid Columns Control
                  Text("Grid Columns: $gridColumns", color = Color.Gray)
                  Slider(
